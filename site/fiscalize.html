<style>
/* App do Fiscalize: barra superior com a marca, conteúdo em cartões de vidro, navegação fixa embaixo
   (Início, Mapa, Quem é quem, Me representa). Telas: início, mapa, estado, cidade, busca e crachá. */
:root{--ink:#0B0B0C;--muted:#5A5D63;--line:rgba(11,11,12,.10);--surface:rgba(255,255,255,.32);--edge:rgba(255,255,255,.92);
  --shadow:0 10px 34px rgba(15,20,30,.08),0 1px 2px rgba(15,20,30,.06);--verde:#1E7A47;--amarelo:#F2C200;--azul:#1F4FBF;--verm:#B3261E;
  --f-display:"Familjen Grotesk",system-ui,sans-serif;--f-body:"Source Sans 3",system-ui,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,monospace;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;background:#FBFBF7}
a{color:inherit}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.glass{background:var(--surface);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border:1px solid var(--edge);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.9)}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) 10px;border-radius:0 0 20px 20px}
.top .brand{display:flex;align-items:center;gap:9px;text-decoration:none;min-width:0}
.top .brand svg{width:34px;height:34px;flex:none}
.top .brand b{font-family:"Bricolage Grotesque",var(--f-display);font-weight:800;font-size:1.02rem;letter-spacing:.01em;text-transform:uppercase;white-space:nowrap}
.top .sp{flex:1}
.top .home{font-weight:600;font-size:.88rem;text-decoration:none;padding:7px 12px;border-radius:999px;border:1px solid rgba(11,11,12,.12);background:rgba(255,255,255,.6);white-space:nowrap}
main{max-width:1040px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(110px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));width:min(760px,calc(100% - 12px));padding:6px;border-radius:24px}
.nav a{display:grid;justify-items:center;gap:2px;padding:7px 2px;border-radius:18px;text-decoration:none;font-size:.66rem;white-space:nowrap;letter-spacing:0;font-weight:700;color:var(--muted);letter-spacing:.01em}
.nav a{letter-spacing:.04em}
@media (max-width:560px){.nav{padding:4px;border-radius:20px}.nav a{font-size:.5rem;letter-spacing:.02em;white-space:normal;text-align:center;line-height:1.1;padding:6px 0;min-width:0;border-radius:14px}.nav a svg{width:20px;height:20px}}
@media (max-width:400px){.nav a{font-size:.44rem;letter-spacing:0}}
.nav a svg{width:22px;height:22px}
.nav a[aria-current="page"]{background:var(--ink);color:#fff}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(1.7rem,6vw,2.4rem)}
h2{font-size:1.25rem}
h3{font-size:1.02rem}
.kick{font-family:var(--f-mono);font-weight:600;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:.84rem}
.card{border-radius:22px;padding:18px;display:grid;gap:12px;min-width:0}
.fx{display:block;width:72px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--verde) 0 33.3%,var(--amarelo) 33.3% 66.6%,var(--azul) 66.6%)}
.src{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);line-height:1.5}
.src a{color:inherit}
.search{position:relative}
.search input{width:100%;padding:14px 16px 14px 44px;border-radius:16px;border:1px solid rgba(11,11,12,.12);background:rgba(255,255,255,.8);outline:none;font-size:1rem}
.search input:focus{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.res{display:grid;gap:6px;margin-top:8px}
.res a{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 14px;border-radius:14px;background:rgba(255,255,255,.75);border:1px solid rgba(11,11,12,.08);text-decoration:none}
.res a:hover{border-color:var(--ink)}
.res small{color:var(--muted);white-space:nowrap}
.steps{display:grid;gap:10px}
.step{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;padding:14px;border-radius:18px;background:rgba(255,255,255,.4);border:1px solid rgba(11,11,12,.08)}
.step i{font-style:normal;width:40px;height:40px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700}
.step b{display:block;font-family:var(--f-display)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:11px 20px;background:var(--ink);color:#fff;font-family:var(--f-display);font-weight:700;text-decoration:none}
.btn.o{background:rgba(255,255,255,.75);color:var(--ink);border:1px solid rgba(11,11,12,.14)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(11,11,12,.06);white-space:nowrap}
.hero>div{min-width:0}.hero .chip{white-space:normal}
.redes{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.redes .rd{display:inline-flex;align-items:baseline;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid rgba(11,11,12,.12);text-decoration:none;color:var(--ink);font-family:var(--f-mono);font-size:.78rem;text-transform:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.redes .rd span{font-family:var(--f-display);font-weight:700;font-size:.72rem;color:var(--muted)}
.redes .rd:hover{border-color:var(--ink)}
.chip.ok{background:rgba(30,122,71,.12);color:var(--verde)}.chip.new{background:rgba(31,79,191,.12);color:var(--azul)}.chip.warn{background:rgba(242,194,0,.22);color:#6b5500}
/* mapa */
.mapwrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.mapwrap{grid-template-columns:1fr}}
.map svg{width:100%;height:auto;display:block}
.map path{fill:rgba(11,11,12,.10);stroke:#FBFBF7;stroke-width:14;stroke-linejoin:round;cursor:pointer;transition:fill .15s}
.map path:hover,.map path:focus{fill:var(--ink);outline:none}
.map text{font-family:var(--f-display);font-weight:700;font-size:118px;fill:var(--ink);pointer-events:none;text-anchor:middle;dominant-baseline:central}

.ufgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ufb{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.72);border:1px solid rgba(11,11,12,.08);text-decoration:none}
.ufb:hover{border-color:var(--ink)}
.ufb b{font-family:var(--f-mono);font-size:.78rem;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--ink);color:#fff;flex:none}
.ufb span{font-size:.9rem;line-height:1.15}
.reg{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:6px 0 -2px}
/* pessoas */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pc{display:grid;gap:8px;justify-items:start;padding:12px;border-radius:18px;background:rgba(255,255,255,.4);border:1px solid rgba(11,11,12,.08);text-decoration:none;min-width:0}
.pc:hover{border-color:var(--ink);transform:translateY(-1px)}
.pc b{font-family:var(--f-display);line-height:1.15;font-size:.98rem;overflow-wrap:anywhere}
.pc small{color:var(--muted);font-size:.8rem;line-height:1.3}
.av{position:relative;width:56px;height:56px;border-radius:16px;overflow:hidden;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,#ECEDEF,#DFE1E5);color:#5E6066;font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;opacity:0;transition:opacity .25s ease}.av img.ok{opacity:1}
.av.lg{width:104px;height:124px;border-radius:22px;font-size:2rem}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.row2>*{min-width:0}
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.lead{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:18px;background:rgba(255,255,255,.4);border:1px solid rgba(11,11,12,.08);text-decoration:none}
.lead:hover{border-color:var(--ink)}
.lead b{font-family:var(--f-display);display:block;line-height:1.15}
.lead small{color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid rgba(11,11,12,.14);background:rgba(255,255,255,.7);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.86rem}
.tab[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kv>div{padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.75);border:1px solid rgba(11,11,12,.08)}
.kv .l{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kv .v{font-family:var(--f-display);font-weight:700;font-size:1.15rem;line-height:1.2;font-variant-numeric:tabular-nums}
.kv .s{font-size:.78rem;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:24px}
.filter{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter input{flex:1 1 220px;padding:10px 14px;border-radius:999px;border:1px solid rgba(11,11,12,.12);background:rgba(255,255,255,.8);outline:none}
.more{justify-self:center}
.note{font-size:.86rem;padding:10px 14px;border-radius:14px;background:rgba(242,194,0,.16);border:1px solid rgba(242,194,0,.35)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:520px){.top .acl-t{display:none}}
.top .acl svg{width:17px;height:17px;display:block}.top .acl{display:inline-flex;align-items:center;justify-content:center}
@media (max-width:560px){.top{gap:6px;padding-left:12px;padding-right:12px}.top .brand{gap:7px;flex:1 1 auto;min-width:0}.top .brand svg{width:30px;height:30px}.top .brand b{font-size:.86rem;overflow:hidden;text-overflow:ellipsis}.top .sp{display:none}.top .home{padding:0;width:38px;height:38px;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:.95rem}.top .home+.home{margin-left:0}.top .home.ini .ini-t{display:none}}
@media (max-width:360px){.top .brand b{display:none}}
.top .home+.home{margin-left:6px}
#est{display:grid;gap:16px;min-width:0}
</style>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s), M=$("#main");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9 ]/g," ").replace(/\s+/g," ").trim();
const title=s=>String(s||"").toLowerCase().replace(/(^|[\s\-'(])([a-zà-ú])/g,(m,a,b)=>a+b.toUpperCase()).replace(/\b(Da|De|Do|Das|Dos|E)\b/g,w=>w.toLowerCase());
const brl=v=>v==null?"—":v.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const mil=v=>(v||0).toLocaleString("pt-BR");
const ini=n=>norm(n).split(" ").filter(w=>w.length>2||/^[A-Z]{1,2}$/.test(w)).slice(0,2).map(w=>w[0]).join("")||"?";
const idade=d=>{const m=/(\d+)\/(\d+)\/(\d{4})/.exec(d||"");if(!m)return null;const b=new Date(+m[3],+m[2]-1,+m[1]),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a};
const store={get(k){try{return JSON.parse(localStorage.getItem("fb_"+k))}catch(e){return null}},set(k,v){try{localStorage.setItem("fb_"+k,JSON.stringify(v))}catch(e){}}};
const ICON_S='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>';
const FONTE_TSE='<a href="https://dadosabertos.tse.jus.br" target="_blank" rel="noopener">TSE · Dados Abertos</a>';
const FONTE_CAM='<a href="https://dadosabertos.camara.leg.br" target="_blank" rel="noopener">Câmara dos Deputados · Dados Abertos</a>';
const FONTE_SEN='<a href="https://legis.senado.leg.br/dadosabertos" target="_blank" rel="noopener">Senado Federal · Dados Abertos</a>';
const RICH=new Set(["PR"]); // estados com ficha completa (votos, projetos, emendas) na página do Paraná

/* ---------- dados ---------- */
let BR=null, CID=null; const UF={};
const getJSON=async u=>{const r=await fetch(u);if(!r.ok)throw new Error(u+" "+r.status);return r.json()};
const loadBR=async()=>BR||(BR=await getJSON("data/br.json"));
const loadCID=async()=>CID||(CID=(await getJSON("data/cidades.json")).map(c=>({ue:c[0],nome:c[1],uf:c[2],n:norm(c[1])})));

async function wireSearch(id,withPeople){
  const inp=$("#"+id),out=$("#"+id+"-r");await loadCID();if(withPeople)await loadBR();
  inp.addEventListener("input",()=>{const cep=inp.value.replace(/\D/g,"");
    if(/^\d{5}-?\d{0,3}$/.test(inp.value.trim())){if(cep.length<8){out.innerHTML='<p class="muted small" style="margin:4px 2px">Digite os 8 números do CEP.</p>';return}
      out.innerHTML='<p class="muted small" style="margin:4px 2px">Procurando o CEP…</p>';
      fetch("https://viacep.com.br/ws/"+cep+"/json/").then(r=>r.json()).then(j=>{if(j.erro||!j.localidade){out.innerHTML='<p class="muted small" style="margin:4px 2px">CEP não encontrado.</p>';return}
        const c=CID.find(x=>x.uf===j.uf&&x.n===norm(j.localidade));
        out.innerHTML=c?`<a href="#/cidade/${c.uf}/${c.ue}"><span><b>${esc(j.localidade)}</b> <span class="muted small">CEP ${cep.slice(0,5)}-${cep.slice(5)}${j.bairro?" · "+esc(j.bairro):""}</span></span><small>${c.uf}</small></a>`:`<p class="muted small" style="margin:4px 2px">${esc(j.localidade)} (${esc(j.uf)}) não está na lista de cidades.</p>`}).catch(()=>{out.innerHTML='<p class="muted small" style="margin:4px 2px">Não consegui consultar o CEP agora. Digite o nome da cidade.</p>'});return}
    const q=norm(inp.value);out.innerHTML="";if(q.length<2)return;
    const res=[];
    for(const [uf,u] of Object.entries(BR?BR.ufs:{}))if(norm(u.nome).startsWith(q)||uf===q)res.push(`<a href="#/uf/${uf}"><span><b>${esc(u.nome)}</b></span><small>Estado</small></a>`);
    const hits=CID.filter(c=>c.n.startsWith(q)).concat(q.length>3?CID.filter(c=>!c.n.startsWith(q)&&c.n.includes(q)):[]).slice(0,8);
    hits.forEach(c=>res.push(`<a href="#/cidade/${c.uf}/${c.ue}"><span><b>${esc(title(c.nome))}</b></span><small>${c.uf}</small></a>`));
    const seq=++BSEQ;
    if(!withPeople){out.innerHTML=res.join("")||'<p class="muted small" style="margin:4px 2px">Nada encontrado.</p>';return}
    const ts=q.split(" ").filter(t=>t.length>=3);
    if(!ts.length){out.innerHTML=res.join("")+'<p class="muted small" style="margin:4px 2px">Digite pelo menos 3 letras do nome.</p>';return}
    out.innerHTML=res.join("")+'<p class="muted small" style="margin:4px 2px">Procurando…</p>';
    buscaPessoas(q,ts).then(L=>{if(seq!==BSEQ)return;
      const pes=L.slice(0,25).map(e=>`<a href="${e[3]}"><span><b>${esc(e[0])}</b> <span class="muted small">${esc(e[1])}</span></span><small>${esc(e[2])}</small></a>`);
      out.innerHTML=res.concat(pes).join("")+(L.length>25?`<p class="muted small" style="margin:4px 2px">Mais ${L.length-25} com esse nome. Digite o nome completo ou o sobrenome para achar mais rápido.</p>`:"")||'<p class="muted small" style="margin:4px 2px">Nada encontrado.</p>'})});
}
let BSEQ=0;const BCACHE={};
/* busca de todos os políticos (deputados, senadores, governadores, prefeitos, vices e vereadores): índice em data/busca/{3 letras}.json */
async function buscaPessoas(q,ts){
  const t=ts.slice().sort((a,b)=>b.length-a.length)[0],k=t.slice(0,3);
  if(!BCACHE[k])BCACHE[k]=fetch("data/busca/"+k+".json").then(r=>r.ok?r.json():[]).catch(()=>[]);
  const L=await BCACHE[k],w=s=>" "+s;
  const hit=L.filter(e=>ts.every(x=>w(e[4]).includes(" "+x)));
  const peso=e=>{const u=" "+norm(e[0]);return (norm(e[0])===q?0:u.includes(" "+q)?1:ts.every(x=>u.includes(" "+x))?2:4)+(/federal|Senador|Governador/.test(e[1])?0:/estadual|Prefeit/.test(e[1])?0.5:1)};
  const vis=new Set();return hit.sort((a,b)=>peso(a)-peso(b)||a[0].localeCompare(b[0])).filter(e=>!vis.has(e[3])&&vis.add(e[3]));
}

/* Mais votados na cidade (TSE, votação por município): deputados federais, estaduais e senadores, 2022 e 2026 */
async function votadosCidade(uf,ue,nome,ano,cg){
  const el=$("#vmc");if(!el)return;let V;try{V=await getJSON("data/vm/"+uf+".json")}catch(e){return}
  const mun=V.mun[ue];if(!mun)return;const anos=Object.keys(mun).sort().reverse();ano=ano&&mun[ano]?ano:anos[0];
  const D=await loadUF(uf);const NC=new Map();const add=(k,h)=>{if(k&&!NC.has(k))NC.set(k,h)};
  const ln=(c,a)=>{const m=new Map();
    if(c==="F"){BR.dep.filter(d=>d[3]===uf).forEach(d=>m.set(norm(d[5]),"#/p/c/"+d[0]));(D.df26||[]).forEach((p,i)=>{if(!m.has(norm(p[1])))m.set(norm(p[1]),`#/p/f/${uf}/${i}`)})}
    if(c==="S"){BR.sen.filter(x=>x[4]===uf).forEach(x=>m.set(norm(x[2]),"#/p/s/"+x[0]));(D.se26||[]).forEach((p,i)=>{if(!m.has(norm(p[1])))m.set(norm(p[1]),`#/p/n/${uf}/${i}`)})}
    if(c==="E"){const f=(arr,y)=>(arr||[]).forEach((p,i)=>{if(!m.has(norm(p[1])))m.set(norm(p[1]),`#/p/e/${uf}/${y}/${i}`)});if(a==="2026"){f(D.de26,26);f(D.de22,22)}else{f(D.de22,22);f(D.de26,26)}}
    return m};
  const CN={F:uf==="DF"?"Deputado federal":"Deputado federal",E:uf==="DF"?"Deputado distrital":"Deputado estadual",S:"Senador"};
  const cgs=["F","S","E"].filter(c=>mun[ano][c]);cg=cg&&mun[ano][cg]?cg:cgs[0];
  const [top,tot]=mun[ano][cg];const C=V.anos[ano][cg];const L=ln(cg,ano);const mx=top.length?top[0][1]:1;
  el.innerHTML=`<section class="card glass"><h2>Mais votados em ${esc(nome)}</h2>
   <div class="chips">${anos.map(a=>`<button class="chip" data-a="${a}" aria-pressed="${a===ano}" style="${a===ano?"background:var(--ink);color:var(--bg,#fff)":""}">${a}</button>`).join("")}<span style="width:10px"></span>${cgs.map(c=>`<button class="chip" data-c="${c}" aria-pressed="${c===cg}" style="${c===cg?"background:var(--ink);color:var(--bg,#fff)":""}">${CN[c]}</button>`).join("")}</div>
   <div class="tl" style="margin-top:10px">${top.map(([i,v],k)=>{const p=C[i];const h=L.get(norm(p[1]));const nm=`${k+1}. ${esc(title(p[0]))} <span class="muted small">${esc(p[2])}</span>${p[3]?' <span class="chip" style="padding:2px 7px;font-size:.62rem">Eleito</span>':""}`;
     return `<div><span>${h?`<a href="${h}">${nm}</a>`:nm}</span><b>${mil(v)} <span class="muted small">${tot?(100*v/tot).toLocaleString("pt-BR",{maximumFractionDigits:1}):"0"}%</span></b>${bar(v,mx)}</div>`}).join("")}</div>
   <p class="src">Votos nominais no 1º turno de ${ano} nesta cidade (todas as zonas); % sobre os votos nominais para o cargo aqui. "Eleito" = eleito no estado. Fonte: ${FONTE_TSE}</p></section>`;
  el.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>votadosCidade(uf,ue,nome,b.dataset.a,cg));
  el.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>votadosCidade(uf,ue,nome,ano,b.dataset.c));
}
/* Câmaras com SAPL público: projetos e votos de cada vereador, e suplentes que assumiram */
async function camCidade(uf,ue){
  const C=await getJSON("data/cam/"+ue+".json").catch(()=>null);if(!C)return;
  const xs=Object.entries(C.dep).filter(([k])=>k[0]==="x").sort((a,b)=>a[1].nome.localeCompare(b[1].nome));
  const nm=n=>title(String(n).replace(/^(VEREADOR[A]?|VER\.)\s+/i,""));
  const sec=document.createElement("section");sec.className="card glass";
  sec.innerHTML=`<h2>Câmara Municipal</h2><p class="muted" style="margin:0">Esta Câmara publica os dados no SAPL: abra a ficha de cada vereador para ver os projetos que apresentou desde 2025${C.temVotos?" e como votou em cada votação nominal":""}.</p>
   ${xs.length?`<h3>Suplentes que assumiram <span class="muted small">(${xs.length})</span></h3><div class="people">${xs.map(([k,e])=>pcard(`#/p/w/${uf}/${ue}/${k}`,nm(e.nome),esc(e.partido||""),e.foto||"",'<span class="chip warn">Suplente</span>')).join("")}</div><p class="small muted" style="margin:0">Vereadores com mandato nesta legislatura que não estão entre os eleitos de 2024 no TSE. A lista inclui quem já deixou a cadeira.</p>`:""}
   <p class="src">Fonte: <a href="${esc(C.url)}" target="_blank" rel="noopener">${esc(C.fonte)}</a>. Atualizado em ${new Date(C.gerado+"T12:00").toLocaleDateString("pt-BR")}.</p>`;
  M.append(sec);
}
/* deputados estaduais que exerceram mandato sem estar entre os eleitos de 2022 (suplentes que assumiram), pela lista da Assembleia */
async function supl(uf){
  const E=await getJSON("data/est/"+uf+".json").catch(()=>null);const el=$("#supl");if(!E||!el)return;
  const xs=Object.entries(E.dep).filter(([k])=>k[0]==="x").sort((a,b)=>a[1].nome.localeCompare(b[1].nome));
  if(!xs.length)return;
  const nm=n=>title(String(n).replace(/^(DEPUTAD[OA]|DEP\.)\s+/i,""));
  el.innerHTML=`<section class="card glass"><h2>Suplentes que assumiram <span class="muted small">(${xs.length})</span></h2>
    <div class="people">${xs.map(([k,e])=>pcard(`#/p/x/${uf}/${k}`,nm(e.nome),esc(e.partido||""),e.foto||"",'<span class="chip warn">Suplente</span>')).join("")}</div>
    <p class="src">Deputados que apresentaram proposições nesta legislatura (desde 2023) e não estão entre os eleitos de 2022 no TSE: em geral, suplentes que assumiram no lugar de um titular. A lista inclui quem já deixou a cadeira. Fonte: ${esc(E.fonte)}.</p></section>`;
}
/* emendas de bancada: deputados federais e senadores do estado indicam juntos */
let COLET=null;
async function banc(uf){
  COLET=COLET||await getJSON("data/emendas/coletivas.json").catch(()=>null);const el=$("#banc");if(!COLET||!el)return;
  const b=COLET.lista.find(x=>x[0]==="B"&&x[1]===uf);if(!b)return;
  const mx=b[4].length?b[4][0][2]:1;
  el.innerHTML=`<section class="card glass"><h2>Emendas da bancada federal</h2>
    <p style="margin:0"><b style="font-family:var(--f-display);font-size:1.6rem">${brl(b[3])}</b> <span class="muted">pagos desde 2023 em emendas que os deputados federais e senadores do estado indicam juntos</span></p>
    <h3>Cidades que mais receberam</h3><div class="tl">${b[4].map(([u,m,v])=>`<div><span>${esc(title(m))}${u!==uf?` <small class="muted">${esc(u)}</small>`:""}</span><b>${brl(v)}</b>${bar(v,mx)}</div>`).join("")}</div>
    <p class="src">A cidade é a do cadastro de quem recebeu: repasses ao governo do estado aparecem na capital. Os dados abertos não dizem qual parlamentar indicou cada emenda de bancada. Fonte: ${esc(COLET.fonte)}.</p></section>`;
}
/* emendas que deputados federais e senadores do Paraná mandaram para a cidade */
const EMUF={};
async function emendasCidade(uf,nome){
  let EMPR=EMUF[uf]||(EMUF[uf]=await getJSON("data/emendas/"+uf+".json").catch(()=>null));
  if(!EMPR)return;
  const ALL=EMPR.cid[String(nome).normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z ]/g,"").trim()]||[];
  const L=ALL.filter(x=>x[0]==="C"||x[0]==="S"||x[0]==="X"),K=ALL.filter(x=>x[0]!=="C"&&x[0]!=="S"&&x[0]!=="X");
  const KT={B:"emenda de bancada: deputados e senadores do estado decidem juntos",K:"emenda de comissão do Congresso",R:"emenda do relator-geral do Orçamento"};
  const tot=L.reduce((a,x)=>a+x[4],0);const mx=L.length?L[0][4]:1;
  const sec=document.createElement("section");sec.className="card glass";
  sec.innerHTML=`<h2>Emendas para ${esc(title(nome))}</h2>
   ${L.length?`<p style="margin:0"><b style="font-family:var(--f-display);font-size:1.6rem">${brl(tot)}</b> <span class="muted">pagos por ${L.length} deputado${L.length>1?"s":""} federa${L.length>1?"is":"l"} e senador${L.length>1?"es":""} desde 2023</span></p>
   <div class="tl">${L.map(x=>`<div><span>${x[0]==="X"?`<b>${esc(x[2])}</b> <small class="muted">parlamentar fora do exercício hoje (licenciado, saiu do cargo ou é ex-deputado)</small>`:`<a href="#/p/${x[0]==="C"?"c":"s"}/${x[1]}">${esc(x[2])}</a> <small class="muted">${esc(x[3])} · ${x[0]==="C"?"deputado(a) federal":"senador(a)"}</small>`}${x[5].length?`<br><small class="muted">Para: ${x[5].map(f=>esc(title(f[0]))).join(", ")}</small>`:""}</span><b>${brl(x[4])}</b>${bar(x[4],mx)}</div>`).join("")}</div>`
   :`<p class="muted" style="margin:0">Nenhuma emenda paga por deputados federais e senadores em exercício para esta cidade desde 2023.</p>`}
   ${K.length?`<h3>Emendas coletivas (de bancada e de comissão)</h3><p class="muted small" style="margin:0"><b>${brl(K.reduce((a,x)=>a+x[4],0))}</b> pagos desde 2023. Não dá para saber, pelos dados abertos, qual parlamentar indicou cada uma.</p>
   <div class="tl">${K.map(x=>`<div><span>${esc(x[2])} <small class="muted">${KT[x[0]]||""}</small>${x[5].length?`<br><small class="muted">Para: ${x[5].map(f=>esc(title(f[0]))).join(", ")}</small>`:""}</span><b>${brl(x[4])}</b>${bar(x[4],K[0][4])}</div>`).join("")}</div>`:""}
   <p class="src">Valores pagos a favorecidos com endereço na cidade (prefeitura, fundos, hospitais, entidades), de 2023 a 2026. Entram deputados federais e senadores de qualquer estado (inclusive quem saiu do cargo) e as emendas de bancada, de comissão e do relator-geral. Fonte: ${esc(EMPR.fonte)}.</p>`;
  M.append(sec);
  emendasEstCidade(uf,nome);
}
/* emendas de deputados estaduais para a cidade (PE, MG e GO publicam com o nome do autor) */
async function emendasEstCidade(uf,nome){
  const EE=await getJSON("data/emendas_est/"+uf+".json").catch(()=>null);if(!EE)return;
  const L=EE.cid[String(nome).normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z ]/g,"").trim()]||[];
  const tot=L.reduce((a,x)=>a+x[1],0),mx=L.length?L[0][1]:1;
  const lk=d=>d[1]===null||d[1]===undefined?null:typeof d[1]==="number"?`#/p/e/${uf}/22/${d[1]}`:`#/p/x/${uf}/${d[1]}`;
  const sec=document.createElement("section");sec.className="card glass";
  sec.innerHTML=`<h2>Emendas de deputados estaduais</h2>
   ${L.length?`<p style="margin:0"><b style="font-family:var(--f-display);font-size:1.6rem">${brl(tot)}</b> <span class="muted">empenhados por ${L.length} deputado${L.length>1?"s":""} estadua${L.length>1?"is":"l"} desde ${EE.desde}</span></p>
   <div class="tl">${L.map(([ch,v])=>{const d=EE.dep[ch];const h=lk(d);return `<div><span>${h?`<a href="${h}">${esc(d[0])}</a>`:`<b>${esc(d[0])}</b> <small class="muted">não está entre os eleitos de 2022</small>`}</span><b>${brl(v)}</b>${bar(v,mx)}</div>`}).join("")}</div>`
   :`<p class="muted" style="margin:0">Nenhuma emenda de deputado estadual registrada para esta cidade desde ${EE.desde}.</p>`}
   <p class="src">Valor empenhado (reservado no orçamento do estado para pagar). Fonte: <a href="${esc(EE.url)}" target="_blank" rel="noopener">${esc(EE.fonte)}</a>.</p>`;
  M.append(sec);
}
/* "Acontecendo agora": o que os representantes desta cidade fizeram nas últimas semanas, sem precisar saber o nome de ninguém. */
async function agoraCidade(uf,ue,nome,m){
  const box=$("#agora");if(!box)return;const lim=new Date(Date.now()-30*864e5).toISOString().slice(0,10),dt=d=>d?new Date(d+"T12:00").toLocaleDateString("pt-BR"):"";
  const [S,VCa,VSa,C,Hh]=await Promise.all([getJSON("data/semana.json").catch(()=>null),getJSON("data/camara_votacoes.json").catch(()=>[]),getJSON("data/senado_votacoes.json").catch(()=>[]),
    getJSON("data/cam/"+ue+".json").catch(()=>null),getJSON("data/gab/hist/m"+ue+".json").catch(()=>null)]);
  if(!document.body.contains(box))return;
  const it=[];
  if(S)for(const w of S.semanas.slice(0,5)){
    for(const i of w.c||[]){const x=VCa[i];if(x&&x[1]>=lim&&!/requerimento/i.test(x[7]||""))it.push([x[1],`<b>Câmara votou ${esc(x[5]||"")}</b>: ${x[2]==="1"?"aprovada":"rejeitada"} por ${x[3]} a ${x[4]}. <a href="#/votacao/C/${i}/${uf}">Como votou cada deputado ${deUF(BR.ufs[uf].nome)}</a>`])}
    for(const i of w.s||[]){const x=VSa[i];if(x&&x[1]>=lim&&!/requerimento/i.test(x[4]||""))it.push([x[1],`<b>Senado votou ${esc(x[2]||"")}</b>: ${x[5]==="A"?"aprovada":"rejeitada"}${x[6]==="S"?" (voto secreto)":` por ${x[7]} a ${x[8]}`}. <a href="#/votacao/S/${i}/${uf}">Como votaram os senadores ${deUF(BR.ufs[uf].nome)}</a>`])}
    for(const c of (w.contra||[]))if(c[4]===uf&&w.seg>=lim.slice(0,8)+"01")it.push([w.seg,`<a href="#/p/${c[0]==="C"?"c":"s"}/${c[1]}">${esc(c[2])}</a> (${esc(c[3])}) votou contra o próprio partido ${c[5]} vez${c[5]>1?"es":""} na semana de ${dt(w.seg)}`]);
  }
  if(C&&C.dep)for(const [k,d] of Object.entries(C.dep))for(const p of (d.props||[]))if(p[2]&&p[2]>=lim){const v=m[3][+k];it.push([p[2],`<b>${esc(p[0])}</b> de ${v?`<a href="#/p/m/${uf}/${ue}/${k}">${esc(title(v[0]))}</a>`:esc(d.nome||"vereador")}: ${esc(String(p[1]).slice(0,160))}`])}
  if(Hh&&Hh.ev)for(const [k,L] of Object.entries(Hh.ev))for(const e of L)if(e[0]>=lim){const quem=k==="p"?"do prefeito":k==="v"?"do vice":m[3][+k]?"de "+title(m[3][+k][0]):"";if(quem)it.push([e[0],`${e[1]==="+"?"Entrou":"Saiu"} no gabinete ${esc(quem)}: ${esc(e[2])}${e[3]?" ("+esc(e[3])+")":""}`])}
  it.sort((a,b)=>b[0].localeCompare(a[0]));
  box.innerHTML=`<section class="card glass"><h2>Acontecendo agora em ${esc(nome)}</h2>
    <p class="muted small" style="margin:0 0 8px">O que os representantes de quem mora aqui fizeram nos últimos 30 dias: votações no Congresso, projetos dos vereadores e mudanças nos gabinetes. Sem precisar saber o nome de ninguém.</p>
    ${it.length?`<div class="tl">${it.slice(0,14).map(([d,h])=>`<div><span>${h}</span><b class="small muted">${dt(d)}</b></div>`).join("")}</div>`:'<p class="muted">Nada registrado nos últimos 30 dias para esta cidade.</p>'}
    <p class="src">Votações nominais do Plenário (Câmara e Senado, Dados Abertos); projetos de vereadores onde a Câmara publica em formato aberto; gabinetes onde a Prefeitura e a Câmara publicam a lista de servidores.</p></section>`;
}
async function me(){
  setNav("me");const c=store.get("cidade");
  if(c)return location.replace("#/cidade/"+c.uf+"/"+c.ue);
  M.innerHTML=`<section class="card glass"><span class="kick">Me representa</span><h1>Qual é a sua cidade?</h1><span class="fx"></span><p class="muted" style="margin:0">Digite o nome da cidade ou o seu CEP. Escolha uma vez e esta aba passa a abrir direto nela, com o que está acontecendo, o prefeito, os vereadores e os representantes do seu estado.</p>${searchBox("q2","Cidade ou CEP")}</section>`;
  wireSearch("q2",false);
}
async function quem(){
  setNav("quem");await loadBR();
  M.innerHTML=`<section class="card glass"><span class="kick">Quem é quem</span><h1>Busque um político</h1><span class="fx"></span>${searchBox("q3","Nome de qualquer político eleito")}
   <p class="src">Busca entre todos os eleitos que estão no site: deputados federais e estaduais, senadores, governadores e vices, prefeitos e vices e vereadores de todo o Brasil, além dos eleitos em 2026. Procura pelo nome de urna e pelo nome civil.</p></section>
   <section class="card glass"><h2>Senado <span class="muted small">(81)</span></h2><div class="people">${BR.sen.slice().sort((a,b)=>a[1].localeCompare(b[1])).map(s=>pcard("#/p/s/"+s[0],s[1],esc(s[3])+" · "+s[4],s[5])).join("")}</div><p class="src">Fonte: ${FONTE_SEN}</p></section>`;

}
function notFound(){M.innerHTML='<section class="card glass"><h2>Página não encontrada</h2><a class="btn" href="#/">Voltar ao início</a></section>'}

/* ---------- rotas ---------- */
async function route(){AVN=0;
  const h=(location.hash||"#/").slice(2).split("/").filter(Boolean);
  try{
    if(!h.length)await inicio();
    else if(h[0]==="mapa")await mapa();
    else if(h[0]==="uf")await estado(h[1]);
    else if(h[0]==="cidade")await cidade(h[1],h[2]);
    else if(h[0]==="me")await me();
    else if(h[0]==="quem")await quem();
    else if(h[0]==="congresso")await congresso(h[1]);
    else if(h[0]==="impostometro")await impostometro(h[1]);
    else if(h[0]==="mais")await mais();
    else if(h[0]==="governos")await governos(h[1]);
    else if(h[0]==="stf")await stf();
    else if(h[0]==="agora")await agora();
    else if(h[0]==="doadores")await doadores(h[1]);
    else if(h[0]==="dicionario")await dicionario(h[1]);
    else if(h[0]==="colabore")await colabore();
    else if(h[0]==="partidos")await partidos(h[1]);
    else if(h[0]==="acompanho")await acompanho();
    else if(h[0]==="sair")await FBAcomp.sair(h[1]);
    else if(h[0]==="comparar")await comparar();
    else if(h[0]==="semana")await semanaCongresso(h[1]);
    else if(h[0]==="votacoes")await votacoesImportam();
    else if(h[0]==="votacao")await votacaoPag(h[1],h[2],h[3]);
    else if(h[0]==="metodologia")metodologia();
    else if(h[0]==="privacidade")privacidade();
    else if(h[0]==="p")await cracha(h.slice(1));
    else notFound();
  }catch(e){console.error(e);M.innerHTML=`<section class="card glass"><h2>Não consegui carregar os dados</h2><p class="muted">${esc(e.message)}</p><a class="btn" href="#/">Início</a></section>`}
  if(h[0]!=="p")window.scrollTo(0,0);
}
addEventListener("hashchange",route);route();
