# Convite por e-mail para parlamentares divulgarem o portal. Só roda quando alguém dispara.
# modo: lista (não envia), teste (1 exemplo de cada grupo para o ALERTA_EMAIL), envia (de verdade, até 95 por execução).
name: Convite a parlamentares
on:
  workflow_dispatch:
    inputs:
      modo: { description: "lista, teste ou envia", required: true, default: "lista" }
      grupos: { description: "m = vereadores de Curitiba, e = deputados estaduais PR, c = deputados federais PR", required: false, default: "m e c" }
concurrency: { group: convite, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests==2.32.3
      - name: Convite
        env:
          T: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          RESEND_API_KEY: "${{ secrets.RESEND_API_KEY }}"
          RESPOSTA: "${{ secrets.ALERTA_EMAIL }}"
          MODO: "${{ inputs.modo }}"
          GRUPOS: "${{ inputs.grupos }}"
        run: |
          export CHAVE_BR=$(printf '%s' "$T-fiscaliza-br" | sha256sum | cut -c1-48); echo "::add-mask::$CHAVE_BR"
          python tools/convite_parlamentares.py
      - name: Grava quem já recebeu
        if: ${{ inputs.modo == 'envia' }}
        run: |
          git config user.name "Fiscaliza Brasil (robô)"; git config user.email "robo@fiscalizaja.com.br"
          git add tools/convite_enviados.json
          git diff --cached --quiet || (git commit -m "Convite a parlamentares: registro de envios" && for i in 1 2 3; do git pull --rebase --autostash origin main && git push && break; sleep 5; done)
