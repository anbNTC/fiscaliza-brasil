# Atualiza os dados do Fiscaliza Brasil toda madrugada e grava no repositório.
# Cada etapa pode falhar sem derrubar as outras; o resultado fica em site/data/_coleta.json.
name: Dados

on:
  schedule:
    - cron: "17 6 * * *"   # 03:17 em Brasília, todo dia
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["coleta/camara_orient.py", "coleta/emendas.py", "coleta/assembleias_sapl.py", "coleta/assembleia_sp.py", "coleta/assembleia_sc.py", "coleta/assembleia_ba.py", "tools/**", ".github/workflows/dados.yml"]

permissions:
  contents: write

concurrency: { group: dados, cancel-in-progress: false }

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests==2.32.3

      - name: Câmara · orientação dos partidos e partido no dia de cada votação
        id: orient
        continue-on-error: true
        timeout-minutes: 40
        env: { MAX_MIN: "30" }
        run: python coleta/camara_orient.py 2>&1 | tee /tmp/orient.log

      - name: Salva o progresso (orientações)
        if: always()
        run: |
          git config user.name "Fiscaliza Brasil (robô)"; git config user.email "robo@fiscalizaja.com.br"
          git add site/data/camara_orient.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Câmara: orientações e partido no dia $(date -u +%F)" && git pull --rebase origin main && git push)

      - name: Emendas parlamentares do Brasil todo
        id: emendas
        continue-on-error: true
        timeout-minutes: 30
        run: python coleta/emendas.py 2>&1 | tee /tmp/emendas.log

      - name: Salva o progresso (emendas)
        if: always()
        run: |
          git add site/data/emendas 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Emendas do Brasil $(date -u +%F)" && git pull --rebase origin main && git push)

      - name: Assembleias estaduais (SAPL) · projetos e votos dos deputados estaduais
        id: assembleias
        continue-on-error: true
        timeout-minutes: 45
        env: { MAX_MIN: "35" }
        run: python coleta/assembleias_sapl.py 2>&1 | tee /tmp/assembleias.log

      - name: ALESP (São Paulo) · deputados e proposituras
        id: alesp
        continue-on-error: true
        timeout-minutes: 15
        run: python coleta/assembleia_sp.py 2>&1 | tee -a /tmp/assembleias.log

      - name: ALESC (Santa Catarina) · proposições por deputado
        id: alesc
        continue-on-error: true
        timeout-minutes: 45
        env: { MAX_MIN: "35" }
        run: python coleta/assembleia_sc.py 2>&1 | tail -5 | tee -a /tmp/assembleias.log

      - name: ALBA (Bahia) · proposições por deputado
        id: alba
        continue-on-error: true
        timeout-minutes: 35
        env: { MAX_MIN: "25" }
        run: python coleta/assembleia_ba.py 2>&1 | tail -5 | tee -a /tmp/assembleias.log

      - name: Salva o progresso (Assembleias)
        if: always()
        run: |
          git add site/data/est 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Assembleias estaduais $(date -u +%F)" && git pull --rebase origin main && git push)

      - name: Recalcula partidos, ranking, resumo da semana e médias da cota
        id: calc
        continue-on-error: true
        run: |
          python tools/partidos.py 2>&1 | tail -3 | tee /tmp/calc.log
          python tools/semana.py 2>&1 | tail -2 | tee -a /tmp/calc.log
          python tools/cota_media.py 2>&1 | tail -2 | tee -a /tmp/calc.log

      - name: Relatório da coleta
        if: always()
        run: |
          python - <<'PY'
          import json, datetime, pathlib
          def tail(f):
              p = pathlib.Path(f); return p.read_text()[-1500:] if p.exists() else ""
          rel = {"quando": datetime.datetime.utcnow().isoformat() + "Z",
                 "etapas": {"orientacoes": "${{ steps.orient.outcome }}", "emendas": "${{ steps.emendas.outcome }}", "calculos": "${{ steps.calc.outcome }}", "assembleias": "${{ steps.assembleias.outcome }}"},
                 "log": {"orientacoes": tail("/tmp/orient.log"), "emendas": tail("/tmp/emendas.log"), "calculos": tail("/tmp/calc.log"), "assembleias": tail("/tmp/assembleias.log")}}
          json.dump(rel, open("site/data/_coleta.json", "w"), ensure_ascii=False, indent=1)
          PY

      - name: Grava os dados novos
        if: always()
        run: |
          git add -A site/data
          git diff --cached --quiet && echo "nada mudou" && exit 0
          git commit -m "Dados atualizados $(date -u +%Y-%m-%d)"
          git pull --rebase origin main && git push

  publica:
    needs: coleta
    if: always()
    uses: ./.github/workflows/publica.yml
    secrets: inherit
