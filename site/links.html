<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="links.js"></script>
<script>
(async () => {
  const root = document.getElementById("root");
  const L = window.FBLinks, C = window.FB_CFG || {};
  let p = L.DEF_PROFILE, ls = L.DEF_LINKS, sb = null;
  if (C.url && C.key && window.supabase) {
    try {
      sb = supabase.createClient(C.url, C.key, { auth: { persistSession: false } });
      const [pr, lk] = await Promise.all([
        sb.from("links_profile").select("*").eq("id", 1).maybeSingle(),
        sb.from("links").select("*").eq("active", true).order("position")
      ]);
      if (pr.error || lk.error) throw pr.error || lk.error;
      if (pr.data) p = pr.data;
      if (pr.data || (lk.data && lk.data.length)) ls = lk.data || [];
    } catch (e) { console.warn("links: usando padrão", e); sb = null; }
  }
  const pub = (path) => sb ? sb.storage.from("midia").getPublicUrl(path).data.publicUrl : "";
  document.title = (p.name || "Links") + " · Links";
  if (p.theme === "escuro") document.querySelector('meta[name="theme-color"]').content = "#0B0B0C";
  L.render(root, p, ls, {
    pub,
    onClick: (l) => { if (sb && l.id) sb.rpc("link_click", { p_id: l.id }).then(() => {}, () => {}); }
  });
})();
</script>
<script>if("serviceWorker" in navigator&&/^https:/.test(location.protocol))addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));</script>
