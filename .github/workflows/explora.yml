# Temporário: explora fontes de Assembleias pela saída do Brasil.
name: Explora BR
on:
  workflow_dispatch:
    inputs:
      alvos: { description: "URLs separadas por espaço", required: false, default: "" }
jobs:
  x:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests==2.32.3
      - name: Explora
        env: { T: "${{ secrets.CLOUDFLARE_API_TOKEN }}", ALVOS: "${{ inputs.alvos }}" }
        run: |
          export CHAVE_BR=$(printf '%s' "$T-fiscaliza-br" | sha256sum | cut -c1-48)
          python coleta/explora_br.py $ALVOS
